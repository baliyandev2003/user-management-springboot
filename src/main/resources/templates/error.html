<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error - User Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .error-container {
        max-width: 600px;
        background: white;
        border-radius: 15px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
<div class="error-container text-center">
  <div class="mb-4">
    <i class="fas fa-exclamation-triangle fa-5x text-danger"></i>
  </div>
  <h1 class="text-danger">Oops! Something went wrong</h1>
  <p class="lead mb-4">We're sorry, but something unexpected happened.</p>

  <div th:if="${error}" class="alert alert-warning">
    <strong>Error:</strong> <span th:text="${error}"></span>
  </div>

  <div th:if="${message}" class="alert alert-info">
    <strong>Message:</strong> <span th:text="${message}"></span>
  </div>

  <div class="mt-4">
    <a th:href="@{/}" class="btn btn-primary me-2">
      <i class="fas fa-home me-1"></i> Go Home
    </a>
    <a th:href="@{/login}" class="btn btn-outline-primary">
      <i class="fas fa-sign-in-alt me-1"></i> Login
    </a>
  </div>

  <div class="mt-4 text-muted small">
    <p>If the problem persists, please contact support.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

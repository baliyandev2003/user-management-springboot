<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Select Role - User Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header text-center">
          <h3>Select Your Role</h3>
        </div>
        <div class="card-body text-center">
          <p class="mb-4">Choose your role to continue with registration</p>

          <div class="row">
            <div class="col-md-6 mb-3">
              <div class="card h-100">
                <div class="card-body">
                  <i class="fas fa-user fa-3x text-primary mb-3"></i>
                  <h5 class="card-title">User</h5>
                  <p class="card-text">Regular user account for managing personal data</p>
                  <a th:href="@{/signup?role=USER}" class="btn btn-primary w-100">Sign up as User</a>
                </div>
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <div class="card h-100">
                <div class="card-body">
                  <i class="fas fa-user-shield fa-3x text-danger mb-3"></i>
                  <h5 class="card-title">Admin</h5>
                  <p class="card-text">Administrator account with full system access</p>
                  <a th:href="@{/signup?role=ADMIN}" class="btn btn-danger w-100">Sign up as Admin</a>
                </div>
              </div>
            </div>
          </div>

          <div class="mt-3">
            <p>Already have an account? <a th:href="@{/login}">Login here</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</body>
</html>

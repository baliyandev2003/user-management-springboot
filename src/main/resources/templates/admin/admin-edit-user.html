<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - Admin Panel</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">
            <i class="fas fa-user-shield me-2"></i>Admin Panel
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/admin/dashboard}">
                <i class="fas fa-tachometer-alt me-1"></i>Dashboard
            </a>
            <a class="nav-link" th:href="@{/logout}">
                <i class="fas fa-sign-out-alt me-1"></i>Logout
            </a>
        </div>
    </div>
</nav>


<!-- PAGE CONTENT -->
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0">
                        <i class="fas fa-user-edit me-2"></i>Edit User
                    </h5>
                </div>

                <div class="card-body">

                    <!-- SUCCESS MESSAGE -->
                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

                    <!-- ERROR MESSAGE -->
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>


                    <!-- FORM START -->
                    <form th:action="@{/admin/admin-edit-user/{id}(id=${user.id})}"
                          th:object="${user}"
                          method="post"
                          novalidate>

                        <!-- CSRF -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">


                        <!-- USERNAME + EMAIL -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Username *</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{username}"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email"
                                       class="form-control"
                                       th:field="*{email}"
                                       required>
                            </div>
                        </div>


                        <!-- NAME + PASSWORD -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Full Name *</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{name}"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Password</label>
                                <input type="password"
                                       class="form-control"
                                       th:field="*{password}"
                                       placeholder="Leave blank to keep current password">
                                <small class="text-muted">Enter new password only if you want to change it</small>
                            </div>
                        </div>


                        <!-- ROLE + AGE -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Role *</label>
                                <select class="form-select" th:field="*{role}" required>
                                    <option value="">Select Role</option>
                                    <option value="USER">User</option>
                                    <option value="ADMIN">Admin</option>
                                    <option value="SUPER_ADMIN">Super Admin</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Age</label>
                                <input type="number"
                                       class="form-control"
                                       th:field="*{age}"
                                       min="1"
                                       max="150">
                            </div>
                        </div>


                        <!-- CONTACT -->
                        <div class="mb-3">
                            <label class="form-label">Contact Number</label>
                            <input type="tel"
                                   class="form-control"
                                   th:field="*{contactNumber}"
                                   pattern="[0-9]{10}"
                                   placeholder="Enter 10 digit number">
                            <small class="text-muted">Must be exactly 10 digits</small>
                        </div>


                        <!-- STATUS -->
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" th:field="*{approved}">
                                    <label class="form-check-label">Approved</label>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" th:field="*{active}">
                                    <label class="form-check-label">Active</label>
                                </div>
                            </div>
                        </div>


                        <!-- BUTTONS -->
                        <div class="d-flex justify-content-end gap-2">
                            <button type="submit" class="btn btn-warning">
                                <i class="fas fa-save me-1"></i>Update User
                            </button>

                            <a th:href="@{/admin/dashboard}" class="btn btn-secondary">
                                <i class="fas fa-times me-1"></i>Cancel
                            </a>
                        </div>

                    </form>
                    <!-- FORM END -->

                </div>
            </div>
        </div>
    </div>
</div>


<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

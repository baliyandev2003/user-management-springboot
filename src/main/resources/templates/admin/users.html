<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Manage Users - Admin Panel</title>

  <!-- CSRF META TAGS (REQUIRED FOR SPRING SECURITY AJAX/JS POSTS) -->
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.1/css/dataTables.bootstrap5.min.css">

  <style>
    .admin-sidebar {
        background: #343a40;
        color: white;
        min-height: 100vh;
        padding-top: 20px;
    }
    .admin-sidebar a {
        color: rgba(255,255,255,0.8);
        padding: 10px 15px;
        display: block;
        text-decoration: none;
    }
    .admin-sidebar a:hover, .admin-sidebar a.active {
        color: white;
        background: rgba(255,255,255,0.1);
    }
    .user-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
    }
    .badge-pending { background-color: #ffc107; color: #000; }
    .badge-approved { background-color: #28a745; color: #fff; }
    .badge-inactive { background-color: #dc3545; color: #fff; }
    .badge-admin { background-color: #6610f2; color: #fff; }
    .badge-user { background-color: #6c757d; color: #fff; }
  </style>
</head>

<body>
<div class="container-fluid">
  <div class="row">

    <!-- SIDEBAR -->
    <div class="col-md-2 p-0 admin-sidebar">
      <div class="p-3">
        <h4><i class="fas fa-user-shield me-2"></i>Admin Panel</h4>
      </div>
      <nav class="nav flex-column">
        <a class="nav-link" th:href="@{/admin/dashboard}">
          <i class="fas fa-tachometer-alt me-2"></i>Dashboard
        </a>
        <a class="nav-link" th:href="@{/admin/add-user}">
          <i class="fas fa-user-plus me-2"></i>Add User
        </a>
        <a class="nav-link active" th:href="@{/admin/users}">
          <i class="fas fa-users me-2"></i>Manage Users
        </a>
        <a class="nav-link" th:href="@{/admin/pending-approvals}">
          <i class="fas fa-clock me-2"></i>Pending Approvals
          <span th:if="${pendingCount != null && pendingCount > 0}"
                class="badge bg-danger float-end"
                th:text="${pendingCount}"></span>
        </a>
        <a class="nav-link" th:href="@{/logout}">
          <i class="fas fa-sign-out-alt me-2"></i>Logout
        </a>
      </nav>
    </div>

    <!-- MAIN CONTENT -->
    <div class="col-md-10 p-4">

      <!-- HEADER -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-users me-2"></i>Manage Users</h2>
        <div>
          <a th:href="@{/admin/dashboard}" class="btn btn-secondary me-2">
            <i class="fas fa-arrow-left me-1"></i>Back to Dashboard
          </a>
          <a th:href="@{/admin/add-user}" class="btn btn-success">
            <i class="fas fa-user-plus me-1"></i>Add New User
          </a>
        </div>
      </div>

      <!-- ALERTS -->
      <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <!-- FILTER -->
      <div class="card mb-4">
        <div class="card-body">
          <div class="row">
            <div class="col-md-8">
              <form th:action="@{/admin/users}" method="get" class="row g-3">
                <div class="col-md-5">
                  <select name="status" class="form-select" onchange="this.form.submit()">
                    <option value="">All Users</option>
                    <option value="pending" th:selected="${status == 'pending'}">Pending</option>
                    <option value="approved" th:selected="${status == 'approved'}">Approved</option>
                    <option value="active" th:selected="${status == 'active'}">Active</option>
                    <option value="inactive" th:selected="${status == 'inactive'}">Inactive</option>
                  </select>
                </div>
                <div class="col-md-5">
                  <input type="text" name="search" class="form-control"
                         th:value="${search}" placeholder="Search users">
                </div>
                <div class="col-md-2">
                  <button class="btn btn-primary w-100">
                    <i class="fas fa-search"></i>
                  </button>
                </div>
              </form>
            </div>
            <div class="col-md-4 text-end">
              <p class="mb-0">Total Users: <strong th:text="${totalUsers}">0</strong></p>
            </div>
          </div>
        </div>
      </div>

      <!-- TABLE -->
      <div class="card">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead class="table-light">
              <tr>
                <th>#</th>
                <th>User</th>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Joined</th>
                <th>Actions</th>
              </tr>
              </thead>
              <tbody>

              <tr th:each="user, stat : ${users}">
                <td th:text="${stat.count}"></td>

                <td>
                  <div class="d-flex align-items-center">
                    <img th:if="${user.profilePhoto}" th:src="${user.profilePhoto}" class="user-avatar me-2">
                    <img th:unless="${user.profilePhoto}" src="https://via.placeholder.com/40" class="user-avatar me-2">
                    <div>
                      <strong th:text="${user.name}"></strong>
                    </div>
                  </div>
                </td>

                <td th:text="${user.username}"></td>
                <td th:text="${user.email}"></td>

                <td>
                  <span th:text="${user.role}" class="badge badge-admin"></span>
                </td>

                <td>
                  <span th:if="${!user.approved}" class="badge badge-pending">Pending</span>
                  <span th:if="${user.approved && user.active}" class="badge badge-approved">Active</span>
                  <span th:if="${user.approved && !user.active}" class="badge badge-inactive">Inactive</span>
                </td>

                <td>
                  <small th:text="${#temporals.format(user.createdAt,'dd/MM/yyyy')}"></small>
                </td>

                <td>
                  <div class="btn-group btn-group-sm">

                    <!-- EDIT -->
                    <a th:href="@{/admin/admin-edit-user/{id}(id=${user.id})}"
                       class="btn btn-primary btn-sm">
                      <i class="fas fa-edit"></i>
                    </a>



                    <!-- APPROVE -->
                    <button th:if="${!user.approved}" class="btn btn-success"
                            onclick="approveUser([[${user.id}]])">
                      <i class="fas fa-check"></i>
                    </button>

                    <!-- REJECT -->
                    <button th:if="${!user.approved}" class="btn btn-danger"
                            onclick="rejectUser([[${user.id}]])">
                      <i class="fas fa-times"></i>
                    </button>

                    <!-- TOGGLE -->
                    <button th:if="${user.approved}" class="btn btn-warning"
                            onclick="toggleStatus([[${user.id}]])">
                      <i class="fas" th:class="${user.active ? 'fa-user-slash' : 'fa-user-check'}"></i>
                    </button>

                    <!-- DELETE -->
                    <button class="btn btn-danger"
                            onclick="deleteUser([[${user.id}]])">
                      <i class="fas fa-trash"></i>
                    </button>

                  </div>
                </td>
              </tr>

              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function getCsrfToken(){
      return document.querySelector('meta[name="_csrf"]').getAttribute('content');
  }

  function getCsrfHeader(){
      return document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
  }

  function postAction(url){

      const csrfToken = getCsrfToken();
      const csrfHeader = getCsrfHeader();

      fetch(url, {
          method: 'POST',
          headers: {
              [csrfHeader]: csrfToken,
              'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: `_csrf=${csrfToken}`   // ⭐ VERY IMPORTANT
      })
      .then(res => {
          if(!res.ok) throw new Error("Request failed");
          window.location.reload();
      })
      .catch(err => alert('Action failed: ' + err));
  }

  function deleteUser(id){
      if(confirm('Delete permanently?')){
          postAction(`/admin/delete-user/${id}`);
      }
  }
</script>


</body>
</html>

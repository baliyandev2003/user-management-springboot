<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title} + ' - Admin Panel'">Admin Panel</title>

  <!-- Admin-specific styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/static/admin/css/admin-styles.css}">

  <!-- Page-specific styles -->
  <th:block th:insert="${pageStyles} ?: ~{}"></th:block>
</head>
<body class="admin-body">
<!-- Admin Header -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark admin-navbar">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/admin/dashboard}">
      <i class="fas fa-user-shield me-2"></i>Admin Panel
    </a>

    <!-- Admin User Menu -->
    <div class="navbar-nav ms-auto">
      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" href="#" id="adminDropdown" role="button" data-bs-toggle="dropdown">
          <i class="fas fa-user me-1"></i>
          <span th:text="${currentUser != null ? currentUser.username : 'Admin'}"></span>
        </a>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><span class="dropdown-item-text">
                            <small th:text="${currentUser != null ? currentUser.email : ''}"></small>
                        </span></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" th:href="@{/admin/dashboard}">
            <i class="fas fa-tachometer-alt me-1"></i> Dashboard
          </a></li>
          <li><a class="dropdown-item text-danger" th:href="@{/logout}">
            <i class="fas fa-sign-out-alt me-1"></i> Logout
          </a></li>
        </ul>
      </li>
    </div>
  </div>
</nav>

<!-- Admin Sidebar -->
<div class="admin-container">
  <div class="admin-sidebar">
    <div class="sidebar-header">
      <h5><i class="fas fa-user-cog"></i> Admin Menu</h5>
    </div>
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" th:href="@{/admin/dashboard}">
          <i class="fas fa-tachometer-alt"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/admin/add-user}">
          <i class="fas fa-user-plus"></i> Add User
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/admin/dashboard}">
          <i class="fas fa-users"></i> Manage Users
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/admin/dashboard}">
          <i class="fas fa-clock"></i> Pending Approvals
          <span th:if="${pendingCount > 0}" class="badge bg-danger" th:text="${pendingCount}"></span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Main Content Area -->
  <main class="admin-main">
    <!-- Page-specific content -->
    <th:block th:insert="${content}"></th:block>
  </main>
</div>

<!-- Admin Footer -->
<footer class="admin-footer">
  <div class="container">
    <div class="row">
      <div class="col-md-6">
        <p class="mb-0">© 2024 Admin Panel - User Management System</p>
      </div>
      <div class="col-md-6 text-end">
        <p class="mb-0">Version 1.0.0 | Admin Access Only</p>
      </div>
    </div>
  </div>
</footer>

<!-- Admin-specific scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/static/admin/js/admin-scripts.js}"></script>

<!-- Page-specific scripts -->
<th:block th:insert="${pageScripts} ?: ~{}"></th:block>
</body>
</html>

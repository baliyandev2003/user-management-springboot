<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{Layout/Users/Sidebar-Users :: layout(~{::content})}">



<th:block th:fragment="content">

    <div class="container-fluid py-4">

        <!-- Welcome Card -->
        <div class="card shadow-sm border-0 mb-4" style="border-radius:18px;">
            <div class="card-body d-flex justify-content-between align-items-center">

                <div>
                    <h2 class="fw-bold">
                        Welcome,
                        <span th:text="${user.name}">User</span> 👋
                    </h2>
                    <p class="text-muted mb-0">
                        Here is your profile overview.
                    </p>
                </div>

                <!-- Profile Image -->
                <div>
                    <img th:if="${user.profilePhoto != null}"
                         th:src="@{${user.profilePhoto}}"
                         class="rounded-circle shadow"
                         style="width:90px;height:90px;object-fit:cover;">

                    <i th:unless="${user.profilePhoto != null}"
                       class="fas fa-user-circle fa-5x text-secondary"></i>
                </div>

            </div>
        </div>


        <!-- Profile Details Card -->
        <div class="card shadow-sm border-0 mb-4" style="border-radius:18px;">
            <div class="card-body">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <strong>Email</strong>
                        <p class="text-muted mb-0"
                           th:text="${user.email}">email</p>
                    </div>

                    <div class="col-md-6">
                        <strong>Contact</strong>
                        <p class="text-muted mb-0"
                           th:text="${user.contactNumber != null ? user.contactNumber : 'Not Provided'}">
                        </p>
                    </div>
                </div>


                <div class="row mb-3">
                    <div class="col-md-6">
                        <strong>Age</strong>
                        <p class="text-muted mb-0"
                           th:text="${user.age != null ? user.age : 'Not Provided'}">
                        </p>
                    </div>

                    <div class="col-md-6">
                        <strong>Role</strong>
                        <p class="text-muted mb-0"
                           th:text="${user.role}">
                        </p>
                    </div>
                </div>


                <div class="mb-3">
                    <strong>Address</strong>
                    <p class="text-muted mb-0"
                       th:text="${user.address != null ? user.address : 'Not Provided'}">
                    </p>
                </div>


                <div class="mb-3">
                    <strong>Bio</strong>
                    <p class="text-muted mb-0"
                       th:text="${user.bio != null ? user.bio : 'No bio added yet.'}">
                    </p>
                </div>


                <div class="text-end">
                    <a th:href="@{/user/profile}" class="btn btn-primary">
                        <i class="fas fa-edit me-1"></i> Edit Profile
                    </a>
                </div>

            </div>
        </div>


        <!-- Logout Button -->
        <div class="text-center">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-danger">
                    <i class="fas fa-sign-out-alt me-1"></i> Logout
                </button>
            </form>
        </div>

    </div>

</th:block>

</html>
